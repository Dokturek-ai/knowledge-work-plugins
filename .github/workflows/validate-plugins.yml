name: Validate Plugins

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-repo:
    name: Repository checks (scripts/check_repo.py)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml==6.0.2
      - run: python scripts/check_repo.py

  claude-plugin-validate:
    name: claude plugin validate --strict
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Bez pinu záměrně, stejně jako v plugin-marketplace-healthcare-dev: nová výtka --strict se má
      # ukázat hned. Když začne být hlučná, připněte verzi CLI.
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace and every plugin
        run: |
          claude --version
          claude plugin validate . --strict
          for p in $(jq -r '.plugins[].source' .claude-plugin/marketplace.json); do
            echo "claude plugin validate $p --strict"
            claude plugin validate "$p" --strict
          done
