    <text x="40" y="97" font-size="17" fill="#5B6665">Tři marketplace a týmový asistent · každý úkol má jedno místo</text>
    <rect x="40" y="124" width="680" height="526" rx="16" fill="#EAF6F4" stroke="#CBE8E3"/>
    <text x="64" y="162" font-size="16" font-weight="700" fill="#145A52">dokturek-work · tento repozitář · práce mimo vývoj</text>
    <rect x="64" y="184" width="304" height="100" rx="12" fill="#FFFFFF" stroke="#D7DCDB"/><text x="84" y="226" font-size="18" font-weight="700" fill="#272E33">product-management</text><text x="84" y="254" font-size="15" fill="#5B6665">Specifikace, roadmapa, sprinty</text><rect x="384" y="184" width="304" height="100" rx="12" fill="#FFFFFF" stroke="#D7DCDB"/><text x="404" y="226" font-size="18" font-weight="700" fill="#272E33">sales</text><text x="404" y="254" font-size="15" fill="#5B6665">Ordinace, hovory, Pipedrive</text><rect x="64" y="300" width="304" height="100" rx="12" fill="#FFFFFF" stroke="#D7DCDB"/><text x="84" y="342" font-size="18" font-weight="700" fill="#272E33">marketing</text><text x="84" y="370" font-size="15" fill="#5B6665">Kampaně, newsletter, web</text><rect x="384" y="300" width="304" height="100" rx="12" fill="#FFFFFF" stroke="#D7DCDB"/><text x="404" y="342" font-size="18" font-weight="700" fill="#272E33">customer-support</text><text x="404" y="370" font-size="15" fill="#5B6665">Požadavky ordinací</text><rect x="64" y="416" width="304" height="100" rx="12" fill="#FFFFFF" stroke="#D7DCDB"/><text x="84" y="458" font-size="18" font-weight="700" fill="#272E33">legal</text><text x="84" y="486" font-size="15" fill="#5B6665">DPA, NDA, GDPR</text><rect x="384" y="416" width="304" height="100" rx="12" fill="#FFFFFF" stroke="#D7DCDB"/><text x="404" y="458" font-size="18" font-weight="700" fill="#272E33">operations</text><text x="404" y="486" font-size="15" fill="#5B6665">Incidenty, nasazení, procesy</text><rect x="64" y="532" width="304" height="100" rx="12" fill="#FFFFFF" stroke="#D7DCDB"/><text x="84" y="574" font-size="18" font-weight="700" fill="#272E33">design</text><text x="84" y="602" font-size="15" fill="#5B6665">České UX texty, přístupnost</text><rect x="384" y="532" width="304" height="100" rx="12" fill="#FFFFFF" stroke="#D7DCDB"/><text x="404" y="574" font-size="18" font-weight="700" fill="#272E33">data</text><text x="404" y="602" font-size="15" fill="#5B6665">SQL a pilot bez dat pacientů</text>
    <rect x="760" y="124" width="400" height="236" rx="16" fill="#FFFFFF" stroke="#D7DCDB"/>
    <text x="784" y="162" font-size="16" font-weight="700" fill="#145A52">dokturek-team</text>
    <text x="784" y="186" font-size="14" fill="#5B6665">Vývoj EHR a oborové znalosti</text>
    <path d="M784 204H1136" stroke="#D7DCDB"/>
    <text x="784" y="228" font-size="15" font-weight="600" fill="#145A52">ehr-design</text><text x="952" y="228" font-size="15" font-weight="600" fill="#145A52">fhir</text><text x="784" y="254" font-size="15" font-weight="600" fill="#145A52">medplum ×4</text><text x="952" y="254" font-size="15" font-weight="600" fill="#145A52">cdss</text><text x="784" y="280" font-size="15" font-weight="600" fill="#145A52">mdr-compliance</text><text x="952" y="280" font-size="15" font-weight="600" fill="#145A52">cz-health-ai</text><text x="784" y="306" font-size="15" font-weight="600" fill="#145A52">vykazovani</text><text x="952" y="306" font-size="15" font-weight="600" fill="#145A52">mzcr-ez</text><text x="784" y="332" font-size="15" font-weight="600" fill="#145A52">plugin-development</text><text x="952" y="332" font-size="15" font-weight="600" fill="#145A52">technical-documentation</text>
    <rect x="760" y="376" width="400" height="128" rx="16" fill="#FFFFFF" stroke="#D7DCDB"/>
    <text x="784" y="414" font-size="16" font-weight="700" fill="#145A52">dokturek-dev-toolkit</text>
    <text x="784" y="438" font-size="14" fill="#5B6665">Přístup k datům a k Medplumu, s RISK.md</text>
    <text x="784" y="476" font-size="15" font-weight="600" fill="#145A52">medplum-mcp</text>
    <text x="952" y="476" font-size="15" font-weight="600" fill="#145A52">mcp-smoke</text>
    <rect x="760" y="520" width="400" height="130" rx="16" fill="#FFFFFF" stroke="#D7DCDB"/>
    <text x="784" y="558" font-size="16" font-weight="700" fill="#145A52">OpenClaw ve Slacku</text>
    <text x="784" y="582" font-size="14" fill="#5B6665">Týmový asistent</text>
    <text x="784" y="620" font-size="15" font-weight="600" fill="#145A52">standupy · zápisy · dotazy nad dokturek-docs</text>
    <path d="M720 242H752" stroke="#1E7F74" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  </g>
  <g font-family="Geist, Arial, sans-serif">
    <rect x="40" y="666" width="1120" height="110" rx="16" fill="#EAF6F4" stroke="#CBE8E3"/>
    <rect x="64" y="722" width="190" height="36" rx="18" fill="#FFFFFF" stroke="#CBE8E3"/><text x="82" y="745" font-size="15" font-weight="600" fill="#145A52">Česky, [Z] [P] [N]</text><rect x="266" y="722" width="199" height="36" rx="18" fill="#FFFFFF" stroke="#CBE8E3"/><text x="284" y="745" font-size="15" font-weight="600" fill="#145A52">Jen syntetická data</text><rect x="477" y="722" width="216" height="36" rx="18" fill="#FFFFFF" stroke="#CBE8E3"/><text x="495" y="745" font-size="15" font-weight="600" fill="#145A52">Nic ven bez potvrzení</text><rect x="705" y="722" width="182" height="36" rx="18" fill="#FFFFFF" stroke="#CBE8E3"/><text x="723" y="745" font-size="15" font-weight="600" fill="#145A52">Skill nerozhoduje</text><rect x="899" y="722" width="225" height="36" rx="18" fill="#FFFFFF" stroke="#CBE8E3"/><text x="917" y="745" font-size="15" font-weight="600" fill="#145A52">R-014: žádné dávkování</text>
    <text x="64" y="702" font-size="16" font-weight="700" fill="#145A52">Sdílený kontext Doktůrku v každém skillu</text>
