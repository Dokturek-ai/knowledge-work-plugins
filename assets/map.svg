<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Kde co v Doktůrku najdete</title>
  <desc id="description">Mapa: vlevo osm pluginů marketplace dokturek-work, vpravo marketplace dokturek-team, dokturek-dev-toolkit a asistent OpenClaw. Pluginy předávají klinické a technické úkoly do dokturek-team. Dole pravidla sdíleného kontextu.</desc>
  <rect x="0.5" y="0.5" width="1199" height="799" rx="15.5" fill="#F7FAFA" stroke="#D7DCDB"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1E7F74"/></marker></defs>
  <g font-family="Geist, Arial, sans-serif" fill="#272E33">
